name: "pr-sentinel"
description: "AI-powered pull request review"
author: "Jalal"

inputs:
  github_token:
    description: "GitHub token with pull-request write access"
    required: true
    default: ${{ github.token }}
  api_key:
    description: "API key for the Responses-compatible model provider"
    required: true
  repository:
    description: "Repository as OWNER/REPO"
    required: false
    default: ${{ github.repository }}
  pr_number:
    description: "Pull request number (defaults to the PR that triggered the run)"
    required: false
    default: ""
  config_path:
    description: "Path to the pr-sentinel config file"
    required: false
    default: ""

runs:
  using: "docker"
  image: "Dockerfile"

branding:
  icon: "eye"
  color: "blue"
