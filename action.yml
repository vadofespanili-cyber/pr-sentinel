name: "pr-sentinel"
description: "AI-powered pull request review"
author: "Jalal"

inputs:
  github_token:
    description: "GitHub token with pull-request write access"
    required: true
    default: ${{ github.token }}
  api_key:
    description: "API key for the Responses-compatible model provider"
    required: false
    default: ""
  repository:
    description: "Repository as OWNER/REPO"
    required: false
    default: ${{ github.repository }}
  pr_number:
    description: "Pull request number (defaults to the PR that triggered the run)"
    required: false
    default: ""
  config_path:
    description: "Path to the pr-sentinel config file"
    required: false
    default: ""
  fail_on_severity:
    description: "Fail the run (exit 1) if any reported finding meets this severity: none, critical, high, medium, low"
    required: false
    default: ""
  sarif_out:
    description: "Write findings as SARIF 2.1.0 to this path (relative to the workspace, e.g. pr-sentinel.sarif)"
    required: false
    default: ""
  reviewed_commit:
    description: "Full commit SHA the review covers; shown as 'Reviewed commit: <short-sha>' at the bottom of the summary comment (default: no line)"
    required: false
    default: ""

runs:
  using: "docker"
  image: "Dockerfile"

branding:
  icon: "eye"
  color: "blue"
