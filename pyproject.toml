[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-sentinel-ai"
version = "0.2.3"
description = "AI-powered pull request review bot: GitHub Action and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jalal", email = "vadofespanili@gmail.com" }]
keywords = ["github", "code-review", "ai", "pull-request"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/vadofespanili-cyber/pr-sentinel"
Repository = "https://github.com/vadofespanili-cyber/pr-sentinel"
Issues = "https://github.com/vadofespanili-cyber/pr-sentinel/issues"
Changelog = "https://github.com/vadofespanili-cyber/pr-sentinel/releases"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
pr-sentinel = "pr_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
